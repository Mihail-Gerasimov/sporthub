# Выкатка на боевой сервер: образы собираются здесь (не на сервере — там 2 ГБ памяти,
# см. docker/PRODUCTION.md §1.1), публикуются в GitHub Container Registry, сервер их
# скачивает, накатывает миграции и перезапускает контейнеры.
#
# Запуск — только руками (кнопка «Run workflow») или тегом v*: выкатка необратима
# (миграции), поэтому без явного решения человека она не начинается.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     — адрес сервера
#   DEPLOY_USER     — пользователь ssh (fastuser)
#   DEPLOY_SSH_KEY  — приватный ключ ssh (весь текст файла)
#   DEPLOY_PATH     — каталог с docker-compose.yml на сервере
name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/sporthub-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/sporthub-web

jobs:
  images:
    name: Собрать и опубликовать образы
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Метка образа — короткий хэш коммита
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Бэкенд
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Фронт
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатить на сервер
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Ключ ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Скачать образы, накатить миграции, перезапустить
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; cd '${{ secrets.DEPLOY_PATH }}' \
             && docker compose --profile app --profile migrate pull \
             && docker compose --profile migrate run --rm migrate \
             && docker compose --profile app up -d --no-build \
             && docker image prune -f >/dev/null \
             && sleep 5 && curl -fsS http://127.0.0.1:3001/api/health"
